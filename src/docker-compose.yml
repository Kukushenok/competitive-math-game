services:
  image-service:
      build:
          context: .
          dockerfile: RemoteImageService/ImageService/Dockerfile
      environment:
          - ASPNETCORE_ENVIRONMENT=Production
          - ASPNETCORE_URLS=http://+:8080
          - ASPNETCORE_Kestrel__EndpointDefaults__Protocols=Http2
      networks:
          - my_persistent_network
  competitivebackend:
    image: ${DOCKER_REGISTRY-}competitivebackend
    build:
      context: .
      dockerfile: CompetitiveBackend/Dockerfile
    depends_on:
      - postgres
      - image-service
    ports:
      - "8080:8080"
    networks:
      - my_persistent_network
  postgres:
    container_name: database
    image: postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: maindb
      PGDATA: /data/postgres
    volumes:
        - ./postgres/data:/var/lib/postgresql/data
        - ./postgres/init:/docker-entrypoint-initdb.d/ 
    ports:
        - 5432:5432
    networks:
      - my_persistent_network
networks:
  my_persistent_network:
    driver: bridge
